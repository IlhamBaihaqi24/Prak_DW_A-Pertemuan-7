<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Mahasiswa</title>
    <link rel="stylesheet"
          href="css/style.css">
</head>
<body>

    <main class="container">
        <section class="registration-card">

            <div class="form-header">
                <span class="label">
                    PENDAFTARAN
                </span>
                <h1>
                    Form Pendaftaran Mahasiswa
                </h1>
                <p>
                    Silakan lengkapi data berikut dengan benar.
                </p>
            </div>

            <!--
                Method POST digunakan karena
                data pendaftaran dikirim melalui
                body HTTP request.
            -->
            <form
                action="/proses-pendaftaran"
                method="post">

                <!-- Nama -->
                <div class="form-group">
                    <label for="nama">
                        Nama Lengkap
                    </label>
                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama lengkap"
                        required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nama@email.com"
                        required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        required>
                    <small>
                        Gunakan minimal 8 karakter.
                    </small>
                </div>

                <!-- Umur -->
                <div class="form-group">
                    <label for="umur">
                        Umur
                    </label>
                    <input
                        type="number"
                        id="umur"
                        name="umur"
                        min="16"
                        max="80"
                        placeholder="Contoh: 18">
                </div>

                <!-- Tanggal Lahir -->
                <div class="form-group">
                    <label for="tanggal-lahir">
                        Tanggal Lahir
                    </label>
                    <input
                        type="date"
                        id="tanggal-lahir"
                        name="tanggal_lahir"
                        required>
                </div>

                <!-- Program Studi -->
                <div class="form-group">
                    <label for="program-studi">
                        Program Studi
                    </label>
                    <select
                        id="program-studi"
                        name="program_studi"
                        required>
                        <option value="">
                            -- Pilih Program Studi --
                        </option>
                        <option value="informatika">
                            Teknik Informatika
                        </option>
                        <option value="mesin">
                            Teknik Mesin
                        </option>
                        <option value="elektro">
                            Teknik Elektro
                        </option>
                        <option value="sipil">
                            Teknik Sipil
                        </option>
                    </select>
                </div>

                <!-- Alamat -->
                <div class="form-group">
                    <label for="alamat">
                        Alamat
                    </label>
                    <textarea
                        id="alamat"
                        name="alamat"
                        rows="5"
                        placeholder="Masukkan alamat lengkap"></textarea>
                </div>

                <!-- Button -->
                <div class="button-group">
                    <button
                        type="submit"
                        class="btn btn-primary">
                        Daftar
                    </button>

                    <button
                        type="reset"
                        class="btn btn-reset">
                        Reset
                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary">
                        Kembali
                    </button>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
